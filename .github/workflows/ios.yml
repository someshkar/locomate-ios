name: iOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Boot iPhone simulator
        run: |
          xcrun simctl boot 'iPhone 18 Pro'
          xcrun simctl bootstatus 'iPhone 18 Pro' -b
      - name: Run Swift and simulator UI tests
        run: >-
          xcodebuild -project Locomate.xcodeproj
          -scheme Locomate
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0'
          CODE_SIGNING_ALLOWED=NO
          test
      - name: Build production configuration
        run: >-
          xcodebuild -project Locomate.xcodeproj
          -scheme Locomate
          -configuration Release
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0'
          CODE_SIGNING_ALLOWED=NO
          build
