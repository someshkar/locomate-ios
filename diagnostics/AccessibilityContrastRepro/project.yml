name: AccessibilityContrastRepro
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  ContrastRepro:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.locomate.diagnostics.contrast
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
  ContrastReproUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ContrastRepro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.locomate.diagnostics.contrast.uitests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  ContrastRepro:
    build:
      targets:
        ContrastRepro: all
        ContrastReproUITests: [test]
    test:
      targets: [ContrastReproUITests]
