name: MapKitLegalRepro
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: '-'
targets:
  MapKitLegalRepro:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.locomate.mapkit-legal-repro
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  MapKitLegalReproUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MapKitLegalRepro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.locomate.mapkit-legal-repro.tests
schemes:
  MapKitLegalRepro:
    build:
      targets:
        MapKitLegalRepro: all
        MapKitLegalReproUITests: [test]
    test:
      targets: [MapKitLegalReproUITests]
